# Copy to secrets.yaml and replace these placeholders before any hardware test.
# Never reuse stock device/cloud credentials.
wifi_ssid: "YOUR_ISOLATED_BENCH_NETWORK"
wifi_password: "REPLACE_WITH_YOUR_BENCH_WIFI_PASSWORD"
# Generate with: python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())'
api_encryption_key: "REPLACE_WITH_A_FRESH_BASE64_ENCODED_32_BYTE_KEY"
# Separate from the API key. Generate with: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
ota_password: "REPLACE_WITH_A_FRESH_RANDOM_OTA_PASSWORD"
