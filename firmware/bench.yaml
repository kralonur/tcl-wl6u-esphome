# Minimal bench target for this module's migrated LibreTiny layout.
# No AC UART or GPIO components; logger uses the separate LOG pads.
# Not an application-only drop-in for stock TCL firmware. See README.md.
esphome:
  name: tcl-wl6u-ac
  friendly_name: TCL WL6U AC
  min_version: 2026.10.1
  includes:
    - <wifi_conf.h>
  on_boot:
    # Before Wi-Fi setup (250). The SDK applies this policy on every STA join.
    - priority: 300
      then:
        - lambda: |-
            if (wifi_set_wpa_mode(WPA2_ONLY_MODE) == 0) {
              ESP_LOGI("wifi_security", "Station authentication restricted to WPA2");
            } else {
              ESP_LOGE("wifi_security", "Failed to restrict station authentication to WPA2");
            }

rtl87xx:
  board: generic-rtl8720cf-2mb-992k
  framework:
    version: 1.14.0
    uart_port: 2
    gpio_recover: false

logger:
  baud_rate: 115200
  hardware_uart: UART2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
