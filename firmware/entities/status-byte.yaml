# Inferred telemetry: retain raw units until its scale is established.
platform: template
name: ${entity_name}
disabled_by_default: true
entity_category: diagnostic
accuracy_decimals: 0
state_class: measurement
update_interval: 10s
lambda: |-
  if (!id(ac_control).status_fresh() || id(ac_control).status_length() <= ${index}) return NAN;
  return float(id(ac_control).status()[${index}]);
